name: generate animation
on:
  # 毎時00分付近はGitHub全体でジョブが集中するため、中途半端な時刻にずらす
  # 05:37 UTC = 14:37 JST
  schedule:
    - cron: "37 5 * * *"

  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # リトライ待機の合計28分 + 実行時間に対する余裕
    timeout-minutes: 45
    env:
      SNK_OUTPUTS: |
        dist/github-contribution-grid-snake.svg
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark
    steps:
      # GitHubのGraphQL APIは contributionsCollection に対して
      # RESOURCE_LIMITS_EXCEEDED を「数十分続くバースト」で返すことがある。
      # snk側はGraphQLエラーを即throwしリトライしないため、ここで再試行する。
      #
      # 実測でバーストは約20分継続したため、試行を約28分の窓に分散させる
      # (t=0, 3分, 8分, 16分, 28分)。GitHub Actionsに uses: ステップの
      # ネイティブなリトライが無いため continue-on-error + outcome で実装。
      - name: generate snake.svg (attempt 1/5)
        id: try1
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ env.SNK_OUTPUTS }}

      - name: wait 3m before attempt 2
        if: steps.try1.outcome == 'failure'
        run: sleep 180

      - name: generate snake.svg (attempt 2/5)
        id: try2
        if: steps.try1.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ env.SNK_OUTPUTS }}

      - name: wait 5m before attempt 3
        if: steps.try2.outcome == 'failure'
        run: sleep 300

      - name: generate snake.svg (attempt 3/5)
        id: try3
        if: steps.try2.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ env.SNK_OUTPUTS }}

      - name: wait 8m before attempt 4
        if: steps.try3.outcome == 'failure'
        run: sleep 480

      - name: generate snake.svg (attempt 4/5)
        id: try4
        if: steps.try3.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ env.SNK_OUTPUTS }}

      - name: wait 12m before final attempt
        if: steps.try4.outcome == 'failure'
        run: sleep 720

      # 最終試行は continue-on-error を付けず、失敗させてジョブを落とす
      - name: generate snake.svg (attempt 5/5)
        id: try5
        if: steps.try4.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ env.SNK_OUTPUTS }}

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
