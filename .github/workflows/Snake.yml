name: generate animation
on:
  # 00:00 UTC はGitHubで最も混雑する時刻のため、混雑帯を外した時刻に変更
  # 05:37 UTC = 14:37 JST
  schedule:
    - cron: "37 5 * * *"

  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # リトライ間の待機を含むため延長
    timeout-minutes: 20
    env:
      SNK_OUTPUTS: |
        dist/github-contribution-grid-snake.svg
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark
    steps:
      # GitHubのGraphQL APIが contributionsCollection に対して
      # RESOURCE_LIMITS_EXCEEDED を返すことがあり、snk側にリトライが無いため
      # ここで最大3回まで再試行する
      - name: generate snake.svg (attempt 1)
        id: try1
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ env.SNK_OUTPUTS }}

      - name: wait before retry
        if: steps.try1.outcome == 'failure'
        run: sleep 180

      - name: generate snake.svg (attempt 2)
        id: try2
        if: steps.try1.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ env.SNK_OUTPUTS }}

      - name: wait before final retry
        if: steps.try2.outcome == 'failure'
        run: sleep 300

      # 最終試行は continue-on-error を付けず、失敗させてジョブを落とす
      - name: generate snake.svg (attempt 3)
        id: try3
        if: steps.try2.outcome == 'failure'
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ env.SNK_OUTPUTS }}

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
